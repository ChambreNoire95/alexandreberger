media:
  input: public/uploads
  output: /uploads

content:
  - name: carrousel-ordre
    label: "Ordre du carrousel"
    type: file
    path: src/content/settings/carrousel.json
    fields:
      - name: ordre
        label: "Projets affichés dans le carrousel (home + Créations), dans l'ordre"
        type: string
        list: true

  - name: bande-demo
    label: "Demoreel (accueil)"
    type: file
    path: src/content/settings/bande-demo.json
    fields:
      - { name: video, label: "Lien de la vidéo (YouTube, Vimeo ou Vidéas)", type: string, description: "Intégrée en pleine largeur sur la page d'accueil, juste au-dessus de « Ils m'ont fait confiance ». Si vide, la demoreel n'apparaît pas." }
      - { name: image, label: "Image de couverture (optionnel)", type: image, description: "Format 16/9, affichée avant la lecture, avec un bouton lecture. Si vide : fond sombre avec le bouton lecture." }

  - name: projets-commandes
    label: "Projets — Commandes"
    type: collection
    path: src/content/projets/Commandes
    view:
      fields: [titre, client, date, enChantier]
    fields:
      - { name: titre, label: Accroche, type: string, required: true }
      - { name: slug, label: "Slug (URL de la fiche, avancé)", type: string, description: "⚠️ Change l'adresse publique de la fiche (/projets/<slug>) : ne remplir que si tu veux vraiment changer l'URL, ça casse les liens déjà partagés/indexés. Laisse vide pour garder l'identifiant actuel (basé sur le nom de fichier). Lettres minuscules, chiffres et tirets uniquement." }
      - { name: categorie, type: string, hidden: true, default: commandes }
      - { name: enChantier, label: "Page en chantier", type: boolean, default: false, description: "Si activé, une note rouge italique s'affiche sur la fiche projet pour prévenir que la page est en cours de refonte. Désactiver une fois la page terminée." }
      - { name: brouillon, label: "Brouillon (page désactivée)", type: boolean, default: false, description: "Si activé, la fiche disparaît du site : page en 404, retirée des listes et du carrousel. Désactiver pour la republier." }
      - { name: role, label: "Rôle", type: string, description: "Ex. Réalisateur / Monteur — affiché avec le client (\"Rôle pour Client\") sous l'accroche sur la page Commandes, et dans les métadonnées de la fiche projet." }
      - { name: accroche, label: "Phrase d'accroche", type: text, description: "Une phrase courte affichée dans l'aperçu au survol d'un titre sur la page d'accueil (idéalement 100 à 140 caractères). Si vide, la première phrase du texte est utilisée." }
      - { name: secteurs, label: "Univers", type: select, list: true, options: { values: ["Mode", "Musique", "Série/Cinéma", "Art", "Culture", "Terroir / Gastronomie", "Éducation", "Sciences", "Société", "Sport", "Solidarité", "Environnement"] }, description: "Filtre « Univers » de la page d'accueil (sous « Films de commande »). Ajoute un ou plusieurs univers (ex. un making-of de Stromae : Musique + Culture)." }
      - { name: besoins, label: "Critères", type: select, list: true, options: { values: ["Interviews", "Mise en scène / Direction artistique", "Tournage à l'étranger", "Projet au long cours", "Images d'archives"] }, description: "Filtre « Critères » de la page d'accueil (sous « Films de commande »). Ajoute un ou plusieurs critères auxquels ce film répond." }
      - { name: client, label: Client, type: string }
      - { name: type, label: "Type de film", type: select, options: { values: ["Making-of", "Documentaire", "Activation / Aftermovie", "Institutionnel", "Brand Content", "RSE", "Fiction"] }, description: "Utilisé pour le filtre par catégorie sur la page Commandes." }
      - { name: date, label: Date, type: date, options: { format: "yyyy-MM-dd" }, description: "Détermine aussi l'ordre d'affichage sur la home (plus récente en premier)." }
      - { name: titreFilm, label: "Titre du film", type: string, description: "Titre du film lui-même, affiché au-dessus de l'image dans l'aperçu de la page d'accueil (ex. « Mon Minervois, 30 ans d'aventures »). Si vide, aucun titre n'est affiché." }
      - { name: duree, label: Durée, type: string, description: "Ex. 12 min, 1h30. Affichée à côté du titre du film dans l'aperçu de la page d'accueil, et sur la fiche." }
      - { name: couverture, label: Couverture, type: image }
      - { name: couvertureAlt, label: "Texte alternatif (couverture)", type: string, description: "Décrit l'image pour le SEO et l'accessibilité. Si vide, le titre du projet est utilisé à la place." }
      - { name: carrousel, label: "Afficher dans le carrousel (home)", type: boolean, default: false, description: "Ajoute ce projet au carrousel photo en haut de la page d'accueil. L'ordre se règle dans \"Ordre du carrousel\" (menu de gauche), pas ici." }
      - { name: carrouselTitre, label: "Titre pour le carrousel (optionnel)", type: string, description: "Remplace l'accroche affichée sur la carte du carrousel — utile pour un titre plus court et percutant. Si vide, l'accroche du projet est utilisée." }
      - { name: carrouselImage, label: "Visuel du carrousel (optionnel)", type: image, description: "Image dédiée au carrousel de la home, au format portrait. Si vide, la couverture est utilisée." }
      - { name: carrouselImageAlt, label: "Texte alternatif (visuel carrousel)", type: string }
      - { name: image1, label: "Photo 1", type: image, description: "Photos supplémentaires (optionnelles), affichées sur la fiche projet en plus de la couverture." }
      - { name: image1Alt, label: "Texte alternatif (photo 1)", type: string }
      - { name: image2, label: "Photo 2", type: image }
      - { name: image2Alt, label: "Texte alternatif (photo 2)", type: string }
      - { name: image3, label: "Photo 3", type: image }
      - { name: image3Alt, label: "Texte alternatif (photo 3)", type: string }
      - { name: video, label: "Vidéo (URL)", type: string, description: "Lien YouTube, Vimeo ou autre plateforme d'embed (Vidéas...). Affichée sur la fiche projet." }
      - { name: lieu, label: "Lieu (pour la carte)", type: string, description: "Ex. Troyes, France, ou Île-de-France pour regrouper plusieurs projets sur un même point. Rempli = le projet apparaît sur la carte \"Autour du monde\" ; sa position est calculée automatiquement à partir de ce nom." }
      - { name: latitude, label: Latitude, type: number, options: { min: -90, max: 90 }, description: "Optionnel : ne remplir que pour forcer une position précise si la recherche automatique se trompe (doit être rempli avec Longitude)." }
      - { name: longitude, label: Longitude, type: number, options: { min: -180, max: 180 }, description: "Optionnel : idem, à remplir avec Latitude." }
      - { name: body, label: Contenu, type: rich-text }

  - name: projets-commandes-en
    label: "Projets — Commandes (EN)"
    type: collection
    path: src/content/projets-en/Commandes
    view:
      fields: [titre]
    fields:
      - { name: titre, label: "Titre (EN)", type: string, description: "Titre de la fiche en anglais. Si vide, le titre français est utilisé." }
      - { name: titreFilm, label: "Titre du film (EN)", type: string, description: "À remplir seulement si le film porte un titre différent en anglais. Si vide, le titre d'origine est conservé." }
      - { name: accroche, label: "Phrase d'accroche (EN)", type: text, description: "Aperçu au survol d'un titre sur la page d'accueil (idéalement 100 à 140 caractères)." }
      - { name: carrouselTitre, label: "Titre pour le carrousel (EN)", type: string }
      - { name: couvertureAlt, label: "Texte alternatif (couverture, EN)", type: string }
      - { name: carrouselImageAlt, label: "Texte alternatif (visuel carrousel, EN)", type: string }
      - { name: image1Alt, label: "Texte alternatif (photo 1, EN)", type: string }
      - { name: image2Alt, label: "Texte alternatif (photo 2, EN)", type: string }
      - { name: image3Alt, label: "Texte alternatif (photo 3, EN)", type: string }
      - { name: body, label: "Contenu (EN)", type: rich-text }

  - name: projets-creations
    label: "Projets — Créations"
    type: collection
    path: "src/content/projets/Créations"
    view:
      fields: [titre, annee, enChantier]
    fields:
      - { name: titre, label: Accroche, type: string, required: true }
      - { name: slug, label: "Slug (URL de la fiche, avancé)", type: string, description: "⚠️ Change l'adresse publique de la fiche (/projets/<slug>) : ne remplir que si tu veux vraiment changer l'URL, ça casse les liens déjà partagés/indexés. Laisse vide pour garder l'identifiant actuel (basé sur le nom de fichier). Lettres minuscules, chiffres et tirets uniquement." }
      - { name: categorie, type: string, hidden: true, default: creations }
      - { name: enChantier, label: "Page en chantier", type: boolean, default: false, description: "Si activé, une note rouge italique s'affiche sur la fiche projet pour prévenir que la page est en cours de refonte. Désactiver une fois la page terminée." }
      - { name: brouillon, label: "Brouillon (page désactivée)", type: boolean, default: false, description: "Si activé, la fiche disparaît du site : page en 404, retirée des listes et du carrousel. Désactiver pour la republier." }
      - { name: annee, label: "Année (début)", type: number, options: { min: 1980, max: 2100 }, description: "Détermine aussi l'ordre d'affichage sur la page Créations (plus récente en premier)." }
      - { name: anneeFin, label: "Année de fin (optionnel)", type: number, options: { min: 1980, max: 2100 }, description: "À renseigner uniquement si le projet s'est déroulé sur plusieurs années : affiche par exemple 2020/2021." }
      - { name: genre, label: Genre, type: select, options: { values: ["Fiction", "Documentaire", "Clip", "Expérimental"] }, description: "Affiché à côté de l'année. Utilisé pour le filtre par catégorie sur la page Créations." }
      - { name: role, label: "Rôle", type: select, options: { values: ["Réalisateur", "Producteur"] }, description: "Utilisé pour le second filtre (par rôle) sur la page Créations." }
      - { name: realisateur, label: "Réalisateur (si ce n'est pas moi)", type: string, description: "Pour un projet réalisé par quelqu'un d'autre : son nom s'affiche sous le titre sur la page Créations (« De … »). Laisser vide sinon." }
      - { name: duree, label: Durée, type: string, description: "Ex. 12 min, 1h30. Affichée à côté de l'année." }
      - { name: couverture, label: Couverture, type: image }
      - { name: couvertureAlt, label: "Texte alternatif (couverture)", type: string, description: "Décrit l'image pour le SEO et l'accessibilité. Si vide, le titre du projet est utilisé à la place." }
      - { name: carrousel, label: "Afficher dans le carrousel (home)", type: boolean, default: false, description: "Ajoute ce projet au carrousel photo en haut de la page d'accueil. L'ordre se règle dans \"Ordre du carrousel\" (menu de gauche), pas ici." }
      - { name: carrouselTitre, label: "Titre pour le carrousel (optionnel)", type: string, description: "Remplace l'accroche affichée sur la carte du carrousel — utile pour un titre plus court et percutant. Si vide, l'accroche du projet est utilisée." }
      - { name: carrouselImage, label: "Visuel du carrousel (optionnel)", type: image, description: "Image dédiée au carrousel de la home, au format portrait. Si vide, la couverture est utilisée." }
      - { name: carrouselImageAlt, label: "Texte alternatif (visuel carrousel)", type: string }
      - { name: description, label: Description, type: text, description: "Affichée sur la page Créations, sous les images." }
      - { name: image1, label: "Image 1", type: image }
      - { name: image1Alt, label: "Texte alternatif (image 1)", type: string }
      - { name: image2, label: "Image 2", type: image }
      - { name: image2Alt, label: "Texte alternatif (image 2)", type: string }
      - { name: image3, label: "Image 3", type: image }
      - { name: image3Alt, label: "Texte alternatif (image 3)", type: string }

  - name: projets-creations-en
    label: "Projets — Créations (EN)"
    type: collection
    path: "src/content/projets-en/Créations"
    view:
      fields: [titre]
    fields:
      - { name: titre, label: "Titre (EN)", type: string, description: "Titre de la fiche en anglais. Si vide, le titre français est utilisé." }
      - { name: description, label: "Description (EN)", type: text, description: "Affichée sur la page Créations, sous les images." }
      - { name: carrouselTitre, label: "Titre pour le carrousel (EN)", type: string }
      - { name: couvertureAlt, label: "Texte alternatif (couverture, EN)", type: string }
      - { name: carrouselImageAlt, label: "Texte alternatif (visuel carrousel, EN)", type: string }
      - { name: image1Alt, label: "Texte alternatif (photo 1, EN)", type: string }
      - { name: image2Alt, label: "Texte alternatif (photo 2, EN)", type: string }
      - { name: image3Alt, label: "Texte alternatif (photo 3, EN)", type: string }
      - { name: body, label: "Contenu (EN)", type: rich-text }

  - name: carnet
    label: Carnet
    type: collection
    path: src/content/carnet
    view:
      fields: [titre, date, brouillon]
    fields:
      - { name: titre, label: Titre, type: string, required: true }
      - { name: date, label: Date, type: date, required: true, options: { format: "yyyy-MM-dd" } }
      - { name: extrait, label: Extrait, type: text }
      - { name: couverture, label: Couverture, type: image }
      - { name: couvertureAlt, label: "Texte alternatif (couverture)", type: string, description: "Décrit l'image pour le SEO et l'accessibilité. Si vide, le titre de l'entrée est utilisé à la place." }
      - { name: brouillon, label: Brouillon, type: boolean, default: false }
      - { name: body, label: Article, type: rich-text }

  - name: carnet-en
    label: "Carnet (EN)"
    type: collection
    path: src/content/carnet-en
    view:
      fields: [titre]
    fields:
      - { name: titre, label: "Titre (EN)", type: string }
      - { name: extrait, label: "Extrait (EN)", type: text }
      - { name: couvertureAlt, label: "Texte alternatif (couverture, EN)", type: string }
      - { name: body, label: "Article (EN)", type: rich-text }

  - name: projets-satellites
    label: "Projets Satellites"
    type: collection
    path: src/content/projets-satellites
    view:
      fields: [titre, ordre]
    fields:
      - { name: titre, label: Titre, type: string, required: true }
      - { name: accroche, label: "Accroche", type: text, description: "Résumé court affiché sur le bloc, dans la page Projets Satellites." }
      - { name: couverture, label: Couverture, type: image }
      - { name: couvertureAlt, label: "Texte alternatif (couverture)", type: string, description: "Décrit l'image pour le SEO et l'accessibilité. Si vide, le titre du bloc est utilisé à la place." }
      - { name: ordre, label: "Ordre d'affichage", type: number, description: "Les blocs les plus petits s'affichent en premier. Optionnel." }
      - { name: lien, label: "Lien du bouton Découvrir", type: string, description: "URL externe ou interne. Le bouton n'apparaît sur la page fille que si ce champ est rempli." }
      - { name: body, label: Contenu, type: rich-text }
